[project]
name = "copairs"
version = "0.5.5"
description = "Find pairs and compute metrics between them"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["pairwise", "replication"]
authors = [
  { name = "John Arevalo", email = "johnarevalo@gmail.com" },
  { name = "Alexandr Kalinin", email = "akalinin@broadinstitute.org" },
  { name = "Alan F. Munoz", email = "amunozgo@broadinstitute.org" }
]
dependencies = [
  "pandas",
  "tqdm",
  "statsmodels",
  "duckdb>=1.4.4",
]

[project.optional-dependencies]
numba = ["numba>=0.60"]
# CuPy publishes CUDA 12 wheels for these platforms only. The CUDA AP stage
# also runs Numba kernels.
gpu = [
    "numba>=0.60",
    "cupy-cuda12x>=14; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.3.4",
    "ruff",
    "scikit-learn>=1.3.2",
]
test = [
    "pytest>=8.3.4",
    "scikit-learn>=1.3.2",
]
demo = ["notebook", "matplotlib"]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]>=0.29.1",
    "mkdocs-section-index",
    "mkdocs-jupyter"
]

[project.urls]
"Homepage" = "https://github.com/cytomining/copairs"
"Bug Reports" = "https://github.com/cytomining/copairs/issues"
"Source" = "https://github.com/cytomining/copairs/"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
length-sort = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.3.4",
    "ruff",
    "scikit-learn>=1.3.2",
]
test = [
    "pytest>=8.3.4",
    "scikit-learn>=1.3.2",
]
demo = ["notebook", "matplotlib"]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]>=0.29.1",
    "mkdocs-section-index",
    "mkdocs-jupyter"
]
